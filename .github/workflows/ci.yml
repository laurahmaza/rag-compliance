name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core deps only — no sentence-transformers in CI)
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -v
      - name: BM25 eval on the 30-query labeled set
        run: python -m rag_compliance.cli evaluate --output results/ci_eval.json
      - name: Quality gate (BM25 recall@10 >= 0.80, MRR >= 0.70)
        run: python -m rag_compliance.quality_gate results/ci_eval.json
      - name: Agent smoke test (fake brain — proves the loop, not model quality)
        run: python -m rag_compliance.cli agent --question "What is residual risk?" --brain fake
