# 30 labeled queries over corpus/nist_ai_rmf.yaml.
# Each query's relevant_chunk_ids names the chunk(s) that correctly answer it —
# this is the ground truth for recall@k / precision@k / MRR / NDCG.
#
# Mix of query styles on purpose: some reuse exact terminology from the source
# text (TEVV, PETs, residual risk) where lexical search should do well; others
# paraphrase away from the source wording, to test whether a purely lexical
# baseline misses what a semantic one would catch.

queries:
  - id: q01
    query: "What are the three major categories of AI bias?"
    relevant_chunk_ids: [fair_bias]

